workflows:
  android-release:
    name: OrcaJá — Android Build
    max_build_duration: 60
    environment:
      node: 20.17.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build Vite / React
        script: npm run build

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli@8

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Build Android APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - freddybastos31@gmail.com
        notify:
          success: true
          failure: true
